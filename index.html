<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Games — Narrative &amp; Experience Engineer</title>
  <meta name="description" content="Origami Games — game systems designed to help players reflect on well-being, pressure, and meaning.">

  <!-- Google Fonts: Montserrat Alternates (display/headings) + Source Code Pro (body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Code+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Styles: load in dependency order — tokens first -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body class="page-home">

  <!-- Hidden SVG grain filter — must NOT be display:none (browser won't process SVG filters if display:none) -->
  <!-- filter: url(#grain) in CSS references this element's id -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
    <defs>
      <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
        <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
        <feComposite in="blended" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
  </svg>

  <!-- Nav injected here by js/nav.js — do not put nav markup here directly -->
  <div id="site-nav"></div>

  <main id="main-content">

    <!-- Visually hidden h1 for screen readers — philosophy statement is the primary page identity -->
    <h1 class="visually-hidden">Rebecca Anisman — Narrative &amp; Experience Engineer</h1>

    <section class="hero" aria-label="Introduction">
      <div class="hero__inner">
        <p class="hero__statement">
          I design game systems that encourage players to reflect on their
          well-being and how they navigate pressure and meaning.
        </p>
        <div class="hero__identity">
          <span class="hero__name">Rebecca Anisman</span>
          <span class="hero__role">Narrative &amp; Experience Engineer</span>
        </div>
      </div>
    </section>

    <section class="cards-section" aria-label="Featured projects">
      <div class="container">
        <ul class="cards-grid" role="list">
          <!-- Cards injected by js/projects.js from /data/projects.json -->
        </ul>
      </div>
    </section>

  </main>

  <!-- Footer injected here by js/nav.js — do not put footer markup here directly -->
  <div id="site-footer"></div>

  <!-- GSAP: use defer (NOT async) to preserve execution order -->
  <!-- defer: executes after HTML parsing, in DOM order — correct for dependency chain -->
  <!-- async would execute gsap/ScrollTrigger/animations.js in any order — breaks registration -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js" defer></script>

  <!-- Site JS -->
  <script src="/js/nav.js" defer></script>
  <script src="/js/projects.js" defer></script>
  <script src="/js/animations.js" defer></script>
</body>
</html>
